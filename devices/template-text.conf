# A starting point for a switcher that takes text commands.  These commands
# are made up: replace them with the ones in your box's manual.
name = Example text-command matrix
kind = switch
signal = hdmi
driver = text
inputs = 8
outputs = 8
tie = s in {in} av out {out}!\r\n
untie = s out {out} off!\r\n
read = r av out {out}!\r\n
reply = input {in} -> output {out}
notes = template only: the commands are examples, not a real product's
