; lil' C firmware: one project, two targets.
;   pio run -e cores3 -t upload   M5Stack CoreS3 in the Stack-chan body
;   pio run -e tab5 -t upload     M5Stack Tab5
;   pio run -e tab5-ota -t upload Tab5 over WiFi (once this firmware is on it)
; The Tab5 build includes the RetroKM desk map: lib/rkm_panel is a link to
; ../../MULTI KM/panel/lib/rkm_panel.
[platformio]
default_envs = cores3

[common]
lib_deps =
    m5stack/M5Unified@^0.2.25
    bblanchon/ArduinoJson@^7.2.0

[env:cores3]
platform = espressif32@6.13.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DLILC_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps}
lib_ignore = rkm_panel

; ESP32-P4 needs Arduino-ESP32 3.x: the pioarduino platform
[env:tab5]
; Arduino 3.3. It warns that the Tab5's C6 WiFi firmware (1.4.1) is older than
; its ESP-Hosted (2.12), but WiFi works; it just takes a few seconds to come up.
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
build_flags =
    -DLILC_TAB5
    -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps}

; Updates over WiFi (ArduinoOTA), found by name (its IP changes with DHCP).
[env:tab5-ota]
extends = env:tab5
upload_protocol = espota
upload_port = lilc-tab5.local

[env:cores3-ota]
extends = env:cores3
upload_protocol = espota
upload_port = lilc-stackchan.local
