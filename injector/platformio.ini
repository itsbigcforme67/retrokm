; RetroKM hardware keyboard: an M5Stack NanoC6 playing a PS/2 keyboard
; through a passive USB-to-PS/2 adapter.  See README.md.
;   pio run -t upload        (with the NanoC6 plugged into the laptop)
[env:nanoc6]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> +<../../common/rkm_proto.c>

; Updates over WiFi once it is in place:  pio run -e ota -t upload --upload-port <its IP>
[env:ota]
extends = env:nanoc6
upload_protocol = espota
