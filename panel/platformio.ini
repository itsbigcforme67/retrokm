; RetroKM touch panel: shows the desk and lets you drag monitors around and
; plug machines into the Extron switcher's outputs.
;   pio run -e tab5 -t upload     M5Stack Tab5
;   pio run -e native && .pio/build/native/program
;                                 the same UI in a window on a Linux PC (SDL2)
[platformio]
default_envs = tab5

[common]
lib_deps =
    m5stack/M5Unified@^0.2.25
    bblanchon/ArduinoJson@^7.2.0

; ESP32-P4 needs Arduino-ESP32 3.x: the pioarduino platform.  Same platform as
; the lil' C firmware, which works on this Tab5.
[env:tab5]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps = ${common.lib_deps}

[env:native]
platform = native
build_flags =
    -O2
    -std=c++17
    -lSDL2
    -lpthread
    -DM5GFX_BOARD=board_M5Tab5
    -DPANEL_NATIVE
lib_deps = ${common.lib_deps}
