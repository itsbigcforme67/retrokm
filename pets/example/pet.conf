# The example desk pet (docs/PETS.md).  A placeholder: to make your own,
# copy this folder to pets/<yourpet>/, change "name =" and the numbers, and
# put "pet = <yourpet>" in the [hub] section of retrokm.conf.  Your folder
# stays out of git (only pets/example/ is in the repository).

name = Example                  # what its window says

[look]                          # its eyes, drawn by each machine's agent
shape = 1.0                     # eye height : width (1 = round)
gap = 0.4                       # space between the eyes, in half-eye-widths
pupil = 0.34                    # pupil size, of the eye's half-width
pupil_shape = 1.0               # pupil height : width
rim = 0.10                      # rim thickness
colors = yes                    # no = black and white
background = plain              # or weave (the X root weave)
paper = f4e3c3                  # background
eye = fffdf6                    # the whites
ink = 3b2f2a                    # rims, pupils, lids, mouth
lid = 0.25                      # how far the upper lids come down
blink = 5                       # seconds between blinks, about (0 = never)
mouth = 0.4                     # mouth width, of the window (0 = none)
smile = 0.5                     # -1 frown .. 1 smile

[wander]
every = 15                      # minutes between moves, about (0 = stays put)
stay = 5                        # minutes it stays after being called

[places]                        # how much it likes each machine (0 = never wanders there)
* = 1                           # anywhere not listed
#tv = 3
#work-pc = 0

[manners]
leave_when_typing = yes         # moves on when someone types where it is
avoid_typing = yes              # doesn't go where someone is typing
typing = 10                     # a key this many seconds ago counts as typing

[travel]
time = 3                        # seconds on the way

[looking]
glance = 20                     # seconds between glances around, about (0 = never)
follow = 30                     # % of the time it watches the pointer
wiggle = 4                      # wiggle the mouse this hard to get its attention (0 = never)

[words]                         # short lines, | between choices; empty = says nothing
arrive = hello!|hi there|oh, it's you
leave = bye!|off I go
click = hey!|that tickles
summoned = you called?|here I am
coming = on my way...
