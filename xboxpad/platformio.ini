; RetroKM Xbox pad: an M5Stack Atom S3R playing an original Xbox controller
; (XID "Controller S") with the hub's game pad.  See README.md.
;   pio run -e atoms3r -t upload     (board in pc mode, or fresh)
;   ./update.sh xbox                 (over WiFi)
;   test/run.sh                      (report format tests on the PC)
[env:atoms3r]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = m5stack-atoms3
framework = arduino
board_build.partitions = default_8MB.csv
; USB_MODE=0: the USB port belongs to TinyUSB (OTG) once we start it; until
; then (pc mode) it stays the chip's serial/JTAG port.
board_build.extra_flags =
    -DARDUINO_M5Stack_ATOMS3
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<../../common/rkm_proto.c>
lib_deps =
    m5stack/M5Unified@^0.2.7

[env:ota]
extends = env:atoms3r
upload_protocol = espota
