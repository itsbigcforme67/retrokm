; RetroKM Xbox presser: an M5Stack Atom Lite in an Atom Motion base, pressing the
; Xbox's power button with a servo. Separate from the Xbox pad (xboxpad/), so it can
; stay powered while the console is off. See README.md.
;   pio run -e atomlite -t upload     (over USB, first time)
;   pio run -e ota -t upload --upload-port xboxpress.local
[env:atomlite]
platform = espressif32@6.13.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -DSERVO_SDA=25
    -DSERVO_SCL=21

[env:ota]
extends = env:atomlite
upload_protocol = espota
